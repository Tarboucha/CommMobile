# =============================================================================
# Observability stack — Loki + Promtail + Grafana + Prometheus + exporters.
#
# Phase 1 (logs):    Loki + Promtail + Grafana
# Phase 2 (metrics): + Prometheus + node-exporter + cAdvisor
# Phase 3 (app):     + prom-client /metrics endpoints in apps (future)
# Phase 4 (alerts):  + Alertmanager + Discord webhook (future)
#
# Brought up alongside the base stack:
#   Local (no prod override):
#     docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
#   Production (with prod override):
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                    -f docker-compose.monitoring.yml up -d
#
# Access Grafana:
#   Local:       http://localhost:3005
#   VPS (SSH tunnel):  ssh -L 3005:127.0.0.1:3005 kodo@<vps-ip>
# =============================================================================

services:
  # ─── Loki — log aggregation ──────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: kodo-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    restart: unless-stopped
    # No healthcheck — Loki image is distroless (no wget/curl/sh in PATH).
    # `docker ps` will show "up" but not "healthy"; that's fine.
    # Promtail + Grafana use `depends_on: [loki]` without condition.
    deploy:
      resources:
        limits:
          memory: 384M

  # ─── Promtail — log shipper ─────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: kodo-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Grafana — dashboards + Explore UI ──────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: kodo-grafana
    ports:
      # Loopback only — access via SSH tunnel on the VPS, directly in dev.
      - "127.0.0.1:3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3005}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus
    deploy:
      resources:
        limits:
          memory: 384M

  # ─── Prometheus — metrics scraping + TSDB ───────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: kodo-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── node-exporter — host-level metrics (CPU, mem, disk, network) ───
  node-exporter:
    image: prom/node-exporter:latest
    container_name: kodo-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── postgres-exporter — Postgres metrics ───────────────────────────
  # Connects as `kodo` (full access). For production, create a
  # monitoring-only user with the built-in `pg_monitor` role. Fine for local.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: kodo-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://kodo:${POSTGRES_PASSWORD}@postgres:5432/kodo?sslmode=disable"
    depends_on:
      - postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # ─── cAdvisor — per-container resource metrics ──────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: kodo-cadvisor
    privileged: true
    command:
      # Reduce metric cardinality — drop noisy labels
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  loki_data:
  grafana_data:
  prometheus_data:
