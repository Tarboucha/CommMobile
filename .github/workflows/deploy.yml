name: Deploy

on:
  push:
    branches: [main]

# Only deploy if tests pass
jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: []  # TODO: add 'typecheck' and 'e2e' from test.yml once stable
    # For now, deploy triggers independently. Enable gating by:
    # 1. Changing test.yml to use workflow_call
    # 2. Or using: needs: [typecheck, e2e] after merging into one workflow
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash <<'EOF'
            set -euo pipefail
            cd /opt/kodo

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Building and starting containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

            echo "→ Running migrations..."
            docker compose exec -T kodo-api npx prisma migrate deploy 2>/dev/null || true

            echo "→ Health checks..."
            sleep 5
            for endpoint in "http://localhost:3002/api/v1/health" "http://localhost:3004/health" "http://localhost:3001/health"; do
              if curl -fsS "$endpoint" > /dev/null 2>&1; then
                echo "  ✓ $endpoint"
              else
                echo "  ✗ $endpoint FAILED"
                docker compose logs --tail 20
                exit 1
              fi
            done

            echo "✅ Deploy complete"
          EOF

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy failed — check VPS logs"
