name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd /opt/kodo

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Building and starting containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

            echo "→ Waiting for DB..."
            until docker exec kodo-postgres pg_isready -U kodo -q; do sleep 2; done

            echo "→ Installing extensions (idempotent)..."
            docker exec kodo-postgres psql -U kodo -d kodo -c 'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto;'

            echo "→ Applying Prisma migrations..."
            docker compose exec -T kodo-api npx prisma migrate deploy

            echo "→ Applying SQL functions + triggers (idempotent)..."
            docker exec -i kodo-postgres psql -U kodo -d kodo < db/functions.sql

            echo "→ Health checks..."
            sleep 5
            for endpoint in "http://localhost:3002/api/v1/health" "http://localhost:3004/health" "http://localhost:3001/health"; do
              if curl -fsS "$endpoint" > /dev/null 2>&1; then
                echo "  ✓ $endpoint"
              else
                echo "  ✗ $endpoint FAILED"
                docker compose logs --tail 20
                exit 1
              fi
            done

            echo "✅ Deploy complete"
          EOF
