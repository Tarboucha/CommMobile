name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Job 1: Typecheck + Build ──────────────────────────────
  typecheck:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    # Prisma 7 requires DATABASE_URL even for `prisma generate` (no connection
    # happens — it just parses the config). A dummy URL satisfies env("DATABASE_URL").
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # nextserver
      - name: "nextserver: install"
        run: pnpm install --frozen-lockfile
        working-directory: nextserver

      - name: "nextserver: prisma generate"
        run: npx prisma generate
        working-directory: nextserver

      - name: "nextserver: build"
        run: pnpm build
        working-directory: nextserver
        env:
          # Prevent build-time validation of runtime env vars
          NEXT_TELEMETRY_DISABLED: "1"

      # auth-service
      - name: "auth-service: install + typecheck"
        run: pnpm install && npx tsc --noEmit
        working-directory: auth-service

      # worker
      - name: "worker: install + typecheck"
        run: pnpm install && npx tsc --noEmit
        working-directory: worker

  # ── Job 2: E2E Tests ──────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kodo:testpassword@localhost:5432/kodo
      POSTGRES_PASSWORD: testpassword
      AUTH_SERVICE_URL: http://localhost:3004

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Create .env with test values for docker-compose
      - name: Create test .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgresql://kodo:testpassword@postgres:5432/kodo
          POSTGRES_PASSWORD=testpassword
          RESEND_API_KEY=re_test_dummy
          MAIL_FROM=test@localhost
          APP_URL=http://localhost:3002
          R2_ENDPOINT=http://fake-r2:9000
          R2_ACCESS_KEY_ID=test
          R2_SECRET_ACCESS_KEY=test
          R2_BUCKET=test
          R2_PUBLIC_URL=http://localhost
          EOF
          touch nextserver/.env socket-server/.env

      # Start the full stack
      - name: Start Docker stack
        run: docker compose up -d --build

      # Wait for services to be healthy
      - name: Wait for healthy services
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 60); do
            ALL_HEALTHY=true
            for url in "http://localhost:3002/api/v1/health" "http://localhost:3004/health" "http://localhost:3001/health"; do
              if ! curl -fsS "$url" > /dev/null 2>&1; then
                ALL_HEALTHY=false
                break
              fi
            done
            if [ "$ALL_HEALTHY" = true ]; then
              echo "All services healthy after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Timeout waiting for services"
              docker compose logs
              exit 1
            fi
            sleep 2
          done

      # Prepare DB
      - name: Install extensions
        run: |
          docker exec -i kodo-postgres psql -U kodo -d kodo -c "
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      - name: Apply Prisma migrations + generate client
        run: |
          cd nextserver && pnpm install --frozen-lockfile
          DATABASE_URL="postgresql://kodo:testpassword@localhost:5432/kodo" npx prisma generate
          DATABASE_URL="postgresql://kodo:testpassword@localhost:5432/kodo" npx prisma migrate deploy

      - name: Apply functions + triggers
        run: docker exec -i kodo-postgres psql -U kodo -d kodo < db/functions.sql

      # Seed test data
      - name: Seed test data
        run: |
          chmod +x scripts/seed-test-data.sh
          ./scripts/seed-test-data.sh

      # Run E2E suites
      - name: E2E — Auth flow
        working-directory: nextserver
        run: npx tsx scripts/test-auth-e2e.ts

      - name: E2E — Booking flow
        working-directory: nextserver
        run: npx tsx scripts/test-booking-e2e.ts

      - name: E2E — Socket flow
        working-directory: nextserver
        run: npx tsx scripts/test-socket-e2e.ts

      # Storage e2e skipped in CI — hits real R2, run locally:
      # cd nextserver && npx tsx scripts/test-storage-e2e.ts

      # Security suites (scripts/security/) are NOT run in CI yet —
      # they're still being refined against the real API. Run locally with:
      #   npx tsx scripts/security/run-all.ts
      # Wire into CI once all findings are triaged and assertions stabilized.

      # Cleanup
      - name: Teardown
        if: always()
        run: docker compose down -v
