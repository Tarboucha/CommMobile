# =============================================================================
# Production override — merge with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds nginx + certbot, removes public port mappings on internal services.
# =============================================================================

services:
  # ── nginx reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kodo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro
    depends_on:
      kodo-api:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      socket-server:
        condition: service_healthy
    restart: unless-stopped

  # ── certbot (Let's Encrypt renewal loop) ───────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: kodo-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
       while :; do
         certbot renew --webroot -w /var/www/certbot --quiet;
         sleep 12h & wait $${!};
       done;"
    restart: unless-stopped

  # ── Remove public port mappings (internal only via nginx) ──
  kodo-api:
    ports: !override []

  auth-service:
    ports: !override []

  socket-server:
    ports: !override []

  redis:
    ports: !override []

  postgres:
    ports: !override []
