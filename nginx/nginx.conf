events {
  worker_connections 1024;
}

http {
  # ── Hide nginx version from Server header
  server_tokens off;

  # ── Docker's embedded DNS — re-resolve upstream IPs every 10s
  # Prevents stale IPs after container restarts. Only takes effect when
  # hostnames appear as variables inside `proxy_pass` (see each location).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── WebSocket upgrade mapping (Grafana Live, socket.io) ─
  # Correctly closes the connection when there's no Upgrade header — the
  # canonical form. Use `proxy_set_header Connection $connection_upgrade`
  # instead of a hardcoded "upgrade" in location blocks that handle WS.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Rate limits ──────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=grafana:10m rate=10r/s;

  # ── Gzip ─────────────────────────────────────────────────
  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  gzip_min_length 256;

  # ── Security headers (applied to all servers) ────────────
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # ── HTTP → HTTPS redirect ───────────────────────────────
  server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── api.comchefs.cloud ───────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.comchefs.cloud;

    ssl_certificate     /etc/nginx/certs/live/comchefs.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/comchefs.cloud/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25m;

    # Upstreams use variables so the `resolver` directive re-resolves DNS
    # every `valid=10s`. Static `upstream` blocks would cache IPs until
    # nginx restart, causing 502s after a container gets a new IP.

    # API routes
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      set $kodo_api "kodo-api:3002";
      proxy_pass http://$kodo_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Auth routes (auth-service itself serves /auth/* paths)
    location /auth/ {
      limit_req zone=auth burst=10 nodelay;
      set $auth_service "auth-service:3004";
      proxy_pass http://$auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JWKS (public, no rate limit)
    location /.well-known/jwks.json {
      set $auth_service "auth-service:3004";
      proxy_pass http://$auth_service;
      proxy_set_header Host $host;
    }

    # WebSocket (Socket.io) — strip /ws/ before forwarding to socket-server root
    location /ws/ {
      rewrite ^/ws/(.*)$ /$1 break;
      set $socket_server "socket-server:3001";
      proxy_pass http://$socket_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # Health check (for external monitors) — rewrites to the deep health route
    location /health {
      rewrite ^/health$ /api/v1/health break;
      set $kodo_api "kodo-api:3002";
      proxy_pass http://$kodo_api;
    }

    # Default
    location / {
      return 404 '{"error":"Not found"}';
      add_header Content-Type application/json;
    }
  }

  # ── grafana.comchefs.cloud ───────────────────────────────
  # Observability UI. Grafana's own login is the only auth gate — make sure
  # GRAFANA_ADMIN_PASSWORD is set to something strong in .env before DNS flips.
  server {
    listen 443 ssl http2;
    server_name grafana.comchefs.cloud;

    ssl_certificate     /etc/nginx/certs/live/comchefs.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/comchefs.cloud/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 10m;

    # Grafana Live (WebSockets) — must be listed before `/` so Upgrade is
    # proxied correctly for the streaming endpoints.
    location /api/live/ {
      limit_req zone=grafana burst=20 nodelay;
      set $grafana "grafana:3000";
      proxy_pass http://$grafana;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # Dashboards, login, API — everything non-WebSocket.
    location / {
      limit_req zone=grafana burst=20 nodelay;
      set $grafana "grafana:3000";
      proxy_pass http://$grafana;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── comchefs.cloud (root domain) ─────────────────────────
  server {
    listen 443 ssl http2;
    server_name comchefs.cloud www.comchefs.cloud;

    ssl_certificate     /etc/nginx/certs/live/comchefs.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/comchefs.cloud/privkey.pem;

    # Redirect to API subdomain for now (or serve a landing page later)
    location / {
      return 301 https://api.comchefs.cloud$request_uri;
    }
  }
}
