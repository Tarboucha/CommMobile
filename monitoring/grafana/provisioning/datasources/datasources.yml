# Grafana data sources — auto-provisioned on boot.
#
# Phase 1: Loki (logs).
# Phase 2: + Prometheus (metrics).

apiVersion: 1

datasources:
  # ─── Prometheus (metrics) ───────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 30s
      queryTimeout: 60s
      httpMethod: POST
      # Link exemplar trace_ids to Loki logs when we enable tracing (Phase 3+)
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: loki

  # ─── Loki (logs) ────────────────────────────────────────────────────
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 5000
      timeout: 60
      # Derived fields: auto-link log mentions of a reqId to a filtered query
      derivedFields:
        - datasourceUid: loki
          matcherRegex: 'reqId=([a-zA-Z0-9_-]+)'
          name: "Trace request"
          url: '/explore?left=%5B%22now-1h%22,%22now%22,%22Loki%22,%7B%22expr%22:%22%7Bservice%3D~%5C%22.%2B%5C%22%7D+%7C+json+%7C+reqId%3D%5C%22${__value.raw}%5C%22%22%7D%5D'
