# Grafana dashboard provisioner.
# Auto-loads any *.json file in this directory as a dashboard in the "KoDo" folder.
# Dashboards are read-only in the UI — edit the JSON file + reload.

apiVersion: 1

providers:
  - name: 'kodo'
    orgId: 1
    folder: 'KoDo'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
