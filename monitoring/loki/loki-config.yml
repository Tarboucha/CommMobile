# Loki 3.x — Optimized for low CPU/disk usage.
# WAL disabled, 7-day retention, conservative ingestion limits.
# Adapted from the proven ComChefs2 monitoring stack.

auth_enabled: false

# Single-process (monolithic) mode — all components in one binary.
target: all

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_idle_period: 10m       # flush stale chunks after 10min idle
  chunk_retain_period: 1m
  max_chunk_age: 2h            # force flush every 2h
  wal:
    enabled: false             # ⚡ disable WAL — accept ~5s of loss on crash
                               # for ~50% less disk I/O

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 72h
  ingestion_rate_mb: 8         # 8 MB/s per-tenant ceiling
  ingestion_burst_size_mb: 16
  max_streams_per_user: 5000   # cardinality guard
  max_entries_limit_per_query: 5000
  max_query_length: 721h       # 30-day lookback
  retention_period: 168h       # 7-day retention

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
